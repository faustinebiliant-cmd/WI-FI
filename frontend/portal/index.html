<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSWAGOTech WiFi - Connect</title>
    <style>
      /* Shown the moment the page arrives, while the portal code is still downloading,
         so the customer sees that something is happening. Plain CSS, no script. */
      body { margin: 0; background-color: #f4f6f9; }
      .initial-loader {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #f4f6f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid #e5e9f0; border-top-color: #1a56db; border-radius: 50%;
        animation: spin 0.8s linear infinite; margin-bottom: 16px;
      }
      .loader-text { color: #64748b; font-size: 15px; font-weight: 500; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the portal as soon as its code has loaded -->
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">Connecting to WiFi...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
