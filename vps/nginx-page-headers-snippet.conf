# ============================================================
# Oswagolink - sends the browser safety rules (values: vps/nginx-security-headers.conf)
# Install: sudo install -o root -g root -m 644 vps/nginx-page-headers-snippet.conf /etc/nginx/snippets/oswagolink-page-headers.conf
#          then add inside the HTTPS server { } of sites-available/wifi-app:
#              include snippets/oswagolink-page-headers.conf;
# ============================================================
add_header X-Frame-Options $wifi_page_frame always;
add_header X-Content-Type-Options $wifi_page_nosniff always;
add_header Referrer-Policy $wifi_page_referrer always;
add_header Strict-Transport-Security $wifi_page_hsts always;

# Nginx rule: once a server { } has its own add_header lines, it no longer uses the
# ones from conf.d. So the caching rule from wifi-performance.conf is repeated here,
# otherwise the portal would lose its fast loading.
add_header Cache-Control $wifi_cache_control;
