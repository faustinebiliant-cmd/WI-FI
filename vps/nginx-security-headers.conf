# ============================================================
# Oswagolink - browser safety rules for the pages of oswagolink.co.tz
# (portal, business panel, landing page). Works together with
# vps/nginx-page-headers-snippet.conf, which sends them.
#
# Install: sudo install -o root -g root -m 644 vps/nginx-security-headers.conf /etc/nginx/conf.d/wifi-security-headers.conf
# Undo:    sudo rm /etc/nginx/conf.d/wifi-security-headers.conf  (remove the snippet's include first)
#
# /api/ gets nothing from here: the backend already sends these rules itself,
# and an empty value means Nginx does not add the header (no duplicates).
# The pages already carry their own Content-Security-Policy (added at build
# time by each app's vite.config.js), so it is not repeated here.
# ============================================================

# Other websites may not show these pages inside a frame (stops click tricks)
map $uri $wifi_page_frame {
    ~^/api/  "";
    default  "DENY";
}

# Browsers must not guess a file's type
map $uri $wifi_page_nosniff {
    ~^/api/  "";
    default  "nosniff";
}

# Other websites see only "oswagolink.co.tz", never the full page address
map $uri $wifi_page_referrer {
    ~^/api/  "";
    default  "strict-origin-when-cross-origin";
}

# HTTPS only, for one year (the same value the backend already sends)
map $uri $wifi_page_hsts {
    ~^/api/  "";
    default  "max-age=31536000; includeSubDomains; preload";
}
