# ============================================================
# Oswagolink - admin panel on its own address: admin.oswagolink.co.tz
# Install: sudo install -o root -g root -m 644 vps/nginx-admin-site.conf /etc/nginx/sites-available/oswagolink-admin
#          sudo ln -s /etc/nginx/sites-available/oswagolink-admin /etc/nginx/sites-enabled/oswagolink-admin
#          sudo nginx -t && sudo systemctl reload nginx
# Then:    sudo certbot --nginx -d admin.oswagolink.co.tz
#          (certbot adds the HTTPS part and the http -> https redirect to this file)
#
# Later, to allow only your own internet address, add inside "server { }":
#     allow YOUR.IP.ADDRESS;
#     deny all;
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.oswagolink.co.tz;

    root /var/www/wifi-app/platform;

    # Never list the admin panel in search engines; never show it inside another site
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $wifi_cache_control always;

    # Same backend as the main site
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin panel app (any page address opens index.html; the app shows the page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
