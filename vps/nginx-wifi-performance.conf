# ============================================================
# Oswagolink - faster page loading
# Install: sudo cp vps/nginx-wifi-performance.conf /etc/nginx/conf.d/wifi-performance.conf
# Check:   sudo nginx -t        (only reload when it says "test is successful")
# Apply:   sudo systemctl reload nginx
# Undo:    sudo rm /etc/nginx/conf.d/wifi-performance.conf && sudo nginx -t && sudo systemctl reload nginx
#
# Ubuntu loads every file in /etc/nginx/conf.d/ inside the http { } block,
# so nothing in the site file (sites-available/wifi-app) has to change.
# ============================================================

# HTTP/2: the browser loads the page, its code and its styles over one connection
# at the same time, instead of one after another (needs nginx 1.25.1 or newer).
http2 on;

# Compress JavaScript, styles and JSON (the portal code shrinks from about 200 KB to
# about 67 KB). "gzip on" itself is already set in Ubuntu's nginx.conf.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Caching:
# - files in /assets/ have a new name after every build, so phones may keep them
#   for a year: a returning customer loads the portal code from the phone itself;
# - the pages themselves (index.html) are checked every time, so a new build is
#   seen at once;
# - the API (/api/) sets its own headers, nothing is added here.
map $uri $wifi_cache_control {
    ~^/api/      "";
    ~/assets/    "public, max-age=31536000, immutable";
    default      "no-cache";
}
add_header Cache-Control $wifi_cache_control;
