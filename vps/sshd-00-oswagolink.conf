# ============================================================
# Oswagolink - SSH rules
# Install: sudo install -o root -g root -m 644 vps/sshd-00-oswagolink.conf /etc/ssh/sshd_config.d/00-oswagolink.conf
#          sudo sshd -t && sudo systemctl reload ssh
#          Then, BEFORE closing your window, log in from a new window to prove it works.
# Check:   sudo sshd -T | grep -Ei "^(permitrootlogin|passwordauthentication|maxauthtries|x11forwarding|allowusers) "
# Undo:    sudo rm /etc/ssh/sshd_config.d/00-oswagolink.conf && sudo systemctl reload ssh
#
# The name starts with 00 so it is read first: for SSH the first value read wins,
# so these beat Hostinger's 50-cloud-init.conf (which switches passwords on).
# ============================================================
PermitRootLogin no
AllowUsers biliant
MaxAuthTries 3
X11Forwarding no
KbdInteractiveAuthentication no
# Password login stays on for now (owner's choice); keys also work.
# To allow keys only later: change to "no", reload, and test from a new window.
PasswordAuthentication yes
